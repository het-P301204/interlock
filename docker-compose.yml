# INTERLOCK: the API serving the built web app, with a persistent SQLite volume.
#   cp .env.example .env          # optional: set INTERLOCK_API_TOKEN etc.
#   docker compose up --build
#   open http://127.0.0.1:8787
#
# The port is published on loopback only. Put a TLS-terminating reverse proxy
# in front before exposing it, and set INTERLOCK_API_TOKEN and
# INTERLOCK_ALLOWED_HOSTS for that deployment.

name: interlock

services:
  interlock:
    build: .
    image: interlock:local
    environment:
      INTERLOCK_API_TOKEN: ${INTERLOCK_API_TOKEN:-}
      INTERLOCK_ALLOWED_ORIGINS: ${INTERLOCK_ALLOWED_ORIGINS:-}
      INTERLOCK_ALLOWED_HOSTS: ${INTERLOCK_ALLOWED_HOSTS:-127.0.0.1,localhost}
      INTERLOCK_TRUST_PROXY_HOPS: ${INTERLOCK_TRUST_PROXY_HOPS:-0}
      INTERLOCK_MAX_UPLOAD_MB: ${INTERLOCK_MAX_UPLOAD_MB:-64}
      INTERLOCK_ANALYSIS_TIMEOUT_MS: ${INTERLOCK_ANALYSIS_TIMEOUT_MS:-60000}
      INTERLOCK_WORKER_MAX_MEMORY_MB: ${INTERLOCK_WORKER_MAX_MEMORY_MB:-512}
      INTERLOCK_MAX_CONCURRENT_ANALYSES: ${INTERLOCK_MAX_CONCURRENT_ANALYSES:-2}
      INTERLOCK_RATE_LIMIT_PER_MINUTE: ${INTERLOCK_RATE_LIMIT_PER_MINUTE:-60}
      INTERLOCK_LOG_LEVEL: ${INTERLOCK_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - interlock-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    pids_limit: 256
    restart: unless-stopped

volumes:
  interlock-data:
