name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · fixtures · tests · build · CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Fixtures are up to date with their generator
        run: npm run fixtures:check
      - name: Unit, integration, security and adversarial tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: CLI smoke test
        run: |
          set -u
          cli="node apps/cli/src/main.ts"
          $cli --version
          $cli inspect fixtures/l5x/baseline-safe.L5X
          # Every built-in scenario runs end to end with the gate disabled.
          for id in 01 02 03 04 05 06 07 08 09; do $cli scenario "$id" --fail-on none > /dev/null; done
          $cli analyze fixtures/l5x/baseline-safe.L5X fixtures/l5x/current-normal.L5X \
            --manifest fixtures/manifests/northgate.safety.json --format sarif --out interlock.sarif
          # A weakened shutdown must fail the gate with exit code 2.
          set +e
          $cli analyze fixtures/l5x/baseline-safe.L5X fixtures/l5x/current-shutdown-weakened.L5X \
            --manifest fixtures/manifests/northgate.safety.json --fail-on high
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then echo "expected exit code 2, got $code"; exit 1; fi
          # A hostile file must be rejected with exit code 1.
          set +e
          $cli inspect fixtures/adversarial/xxe-external-entity.L5X
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Lockfile integrity without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

  container:
    name: container build · smoke · SBOM · scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: verify
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: interlock:ci
      - name: Run the container, wait for health, smoke test
        run: |
          docker run -d --name interlock -p 8787:8787 --read-only --tmpfs /tmp \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -e INTERLOCK_DB=memory interlock:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8787/api/health && break; sleep 1; done
          echo
          test "$(docker inspect -f '{{.Config.User}}' interlock)" = "node"
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' interlock)
            [ "$s" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f 'container health: {{.State.Health.Status}}' interlock
          test "$(docker inspect -f '{{.State.Health.Status}}' interlock)" = "healthy"
          INTERLOCK_SMOKE_API_ONLY=true node scripts/smoke.ts http://127.0.0.1:8787
          # The image also serves the web app.
          curl -fsS http://127.0.0.1:8787/ | grep -q '<div id="root"'
      - name: Container logs
        if: always()
        run: docker logs interlock || true
      - name: Stop container
        if: always()
        run: docker rm -f interlock || true
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: interlock:ci
          format: spdx-json
          output-file: interlock-sbom.spdx.json
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: interlock:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: interlock-sbom.spdx.json

  secrets:
    name: secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history; gitleaks-action diffs from the root
      # commit's parent, which does not exist on a repository's first push.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
