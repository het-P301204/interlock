name: False positive / false negative
description: INTERLOCK reported a finding that is wrong, missed a safety-relevant change, or got a severity, safety function or trust verdict wrong.
labels: [analysis-accuracy]
body:
  - type: markdown
    attributes:
      value: |
        Accuracy reports are the most valuable kind. A missed weakening (false negative) matters more
        than a noisy finding, so please say which one this is.

        **Do not attach real plant exports or safety manifests.** Reduce the case to the smallest
        synthetic export that still shows it (start from `fixtures/l5x/baseline-safe.L5X`) and paste the
        relevant rung text before and after.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - False negative (a safety-relevant change was missed or under-rated)
        - False positive (a finding is wrong or over-rated)
        - Wrong safety function, location or evidence
        - Wrong trust / coverage verdict
    validations:
      required: true
  - type: input
    id: finding
    attributes:
      label: Finding
      description: Finding type and id if one was reported, e.g. NEW_INHIBIT IL-0001 (rule IL-R002).
  - type: textarea
    id: before-after
    attributes:
      label: Logic before and after
      description: Rung text (or the minimal synthetic export) for baseline and current.
      render: text
    validations:
      required: true
  - type: textarea
    id: declaration
    attributes:
      label: Safety declaration
      description: The relevant safety function(s) from the manifest (synthetic names are fine).
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What INTERLOCK should have concluded, and why
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: interlock 0.1.0 (engine 1.0.0)
    validations:
      required: true
